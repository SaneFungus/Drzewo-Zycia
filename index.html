<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kabalistyczny Generator Promptów</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">

  <!-- Tippy.js CSS (UMD) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tippy.js@6/dist/tippy.css">

  <!-- Nasz CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <h1>Kabalistyczny Generator Promptów</h1>

  <div class="tabs">
    <div class="tab active" data-target="basic">Podstawowe</div>
    <div class="tab" data-target="advanced">Zaawansowane</div>
  </div>

  <div id="interface">
    <!-- Podstawowe -->
    <div id="basic" class="panel active">
      <div id="tree-container"></div>
      <div class="section">
        <label>Wybierz sefirotę:</label>
        <div id="checkboxes"></div>
      </div>
      <div class="section">
        <label for="topic">Zagadnienie:</label>
        <input type="text" id="topic" class="input-full" />
      </div>
    </div>
    <!-- Zaawansowane -->
    <div id="advanced" class="panel">
      <button id="toggle-adv" class="icon-btn">Opcje zaawansowane</button>
      <div id="adv-options" class="collapsible">
        <div class="section">
          <label for="styleSelect">Styl odpowiedzi:</label>
          <select id="styleSelect">
            <option value="essay">Esej</option>
            <option value="poem">Wiersz</option>
            <option value="raw">Surowe dane</option>
          </select>
        </div>
        <div class="section">
          <label><input type="checkbox" id="withQuotes" /> Dodaj cytaty kabalistyczne</label>
        </div>
      </div>
    </div>
  </div>

  <div class="actions">
    <button id="generate">Generuj prompt</button>
    <button id="copyBtn">Kopiuj do schowka</button>
  </div>

  <div class="section">
    <label for="preview">Podgląd promptu:</label>
    <textarea id="preview" class="textarea-full"></textarea>
  </div>

  <!-- Biblioteki globalne UMD -->
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2/dist/umd/popper.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tippy.js@6/dist/tippy.umd.min.js"></script>

  <!-- Generator promptów (Twój plik) -->
  <script src="epistemological_tree_prompt_generator.js"></script>

  <!-- Nasze moduły ES -->
  <script type="module">
    import { treeData } from './js/treeData.js';
    import { initTree } from './js/tree.js';
    import { initTabs, initAdvancedToggle } from './js/ui.js';
    import { initPrompt } from './js/prompt.js';

    document.addEventListener('DOMContentLoaded', () => {
      initTabs();
      initAdvancedToggle();
      initTree(treeData, 'tree-container', 'checkboxes');
      initPrompt('generate', 'copyBtn', 'topic', 'styleSelect', 'withQuotes', 'preview');
    });
  </script>
</body>
</html>
